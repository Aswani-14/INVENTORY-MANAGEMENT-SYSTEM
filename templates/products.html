<link rel="stylesheet" href="/static/style.css">

<h2>Products</h2>

<form method="POST">
    <input name="name" placeholder="Name">
    <input name="price" placeholder="Price">
    <input name="qty" placeholder="Quantity">
    <button>Add Product</button>
</form>

<ul>
{% for p in products %}
    <li>{{p.name}} - ₹{{p.price}} - Qty: {{p.qty}}</li>
{% endfor %}
</ul>
