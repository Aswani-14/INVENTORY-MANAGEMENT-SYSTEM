<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
        }

        .navbar {
            background: #1e293b;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .container {
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 0px 10px #000;
        }

        .card h2 {
            margin: 10px 0;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            background: #38bdf8;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 10px;
        }

        .card:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/products">Products</a>
        <a href="/suppliers">Suppliers</a>
        <a href="/report">Report</a>
        <a href="/delete">delete</a>
        <a href="/update">update</a>    
    </div>
    <a href="/logout">Logout</a>
</div>

<div class="container">
    <h1>Welcome to Inventory Dashboard </h1>

    <div class="cards">
        <div class="card">
            <h3>Total Products</h3>
            <h2>{{ product_count }}</h2>
            <a href="/products" class="btn">Add</a>
        </div>

        <div class="card">
            <h3>Total Suppliers</h3>
            <h2>{{ supplier_count }}</h2>
            <a href="/suppliers" class="btn">Add</a>
        </div>
        <div class="card">
            <h3>Update Product</h3>
            <a href="/update" class="btn">Manage</a>
        </div>

        <div class="card">
            <h3>Delete Product</h3>
            <a href="/delete" class="btn">Manage</a>
        </div>
        
        <div class="card">
            <h3>Report</h3>
            <h2>{{Report}}</h2>
            <a href="/report" class="btn">View Reports</a>
        </div>
    </div>
</div>

</body>
</html>
